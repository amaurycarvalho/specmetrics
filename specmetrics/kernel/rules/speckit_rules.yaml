version: "1.0.0"
framework: "speckit"
document_types:
  - "specification"
  - "plan"
  - "tasks"
  - "data-model"
description: "SpecKit framework specialist rule pack for deterministic extraction of CFM and CSM semantic models from SpecKit feature specifications"

rules:
  # Existing heading-based rules (baseline coverage)
  - id: "speckit-feature"
    name: "SpecKit Feature"
    pattern:
      heading: "Feature"
    type: "entity"
    confidence: 1.00
    priority: 95

  - id: "speckit-scenario"
    name: "SpecKit Scenario"
    pattern:
      heading: "Scenario"
    type: "entity"
    confidence: 1.00
    priority: 95

  - id: "speckit-background"
    name: "SpecKit Background"
    pattern:
      heading: "Background"
    type: "entity"
    confidence: 1.00
    priority: 95

  # FR-002: User Story extraction
  - id: "speckit-user-story"
    name: "User Story"
    pattern:
      regex: '^### User Story (\d+) [—–-] (.+) \(Priority: (P[1-3])\)'
    type: "entity"
    confidence: 0.95
    priority: 80

  # FR-003: Priority justification
  - id: "speckit-priority-justification"
    name: "Priority Justification"
    pattern:
      regex: '^\*\*Why this priority\*\*: (.+)$'
    type: "fact"
    confidence: 0.80
    priority: 75

  # FR-004: Numbered GIVEN/WHEN/THEN
  - id: "speckit-gwt-numbered"
    name: "Numbered Given/When/Then"
    pattern:
      regex: '^(\d+)\. \*\*Given\*\* (.+), \*\*When\*\* (.+), \*\*Then\*\* (.+)$'
    type: "fact"
    confidence: 0.90
    priority: 75

  # FR-005: Multi-line GIVEN/WHEN/THEN
  - id: "speckit-gwt-multiline-given"
    name: "Multi-line GIVEN"
    pattern:
      regex: '^-\s+\*\*Given\*\* (.+)$'
    type: "fact"
    confidence: 0.90
    priority: 75
    target_sections:
      - "User Scenarios"

  - id: "speckit-gwt-multiline-when"
    name: "Multi-line WHEN"
    pattern:
      regex: '^-\s+\*\*When\*\* (.+)$'
    type: "fact"
    confidence: 0.90
    priority: 75
    target_sections:
      - "User Scenarios"

  - id: "speckit-gwt-multiline-then"
    name: "Multi-line THEN"
    pattern:
      regex: '^-\s+\*\*Then\*\* (.+)$'
    type: "fact"
    confidence: 0.90
    priority: 75
    target_sections:
      - "User Scenarios"

  # FR-006: FR-NNN requirement
  - id: "speckit-fr-requirement"
    name: "FR Requirement"
    pattern:
      regex: '^-\s+\*\*FR-(\d{3})\*\*: (.+)$'
    type: "fact"
    confidence: 0.95
    priority: 70

  # FR-007: SC-NNN success criteria
  - id: "speckit-sc-success-criteria"
    name: "SC Success Criterion"
    pattern:
      regex: '^-\s+\*\*SC-(\d{3})\*\*: (.+)$'
    type: "fact"
    confidence: 0.95
    priority: 70

  # FR-008: Key Entities
  - id: "speckit-key-entity"
    name: "Key Entity"
    pattern:
      regex: '^-\s+\*\*(.+)\*\*: (.+)$'
    type: "entity"
    confidence: 0.90
    priority: 65
    target_sections:
      - "Key Entities"

  # FR-001: Actor extraction from entity definitions
  - id: "speckit-actor-entity"
    name: "Actor from Entity"
    pattern:
      regex: '^-\s+\*\*([A-Z][a-zA-Z]+)\*\*: (.+)$'
    type: "entity"
    confidence: 0.85
    priority: 68
    target_sections:
      - "Key Entities"

  # FR-009: Assumptions
  - id: "speckit-assumption"
    name: "Assumption"
    pattern:
      regex: '^-\s+(.+)$'
    type: "fact"
    confidence: 0.90
    priority: 60
    target_sections:
      - "Assumptions"

  # FR-010: Constitution Check engaged principles
  - id: "speckit-engaged-principles"
    name: "Engaged Principles"
    pattern:
      regex: '^\*\*Engaged Principles\*\*: (.+)$'
    type: "fact"
    confidence: 0.95
    priority: 75

  # FR-011: Edge Cases
  - id: "speckit-edge-case"
    name: "Edge Case"
    pattern:
      regex: '^-\s+What happens (.+)\? (.+)$'
    type: "fact"
    confidence: 0.85
    priority: 60
    target_sections:
      - "Edge Cases"

  # FR-012: IMP-NNN implementation notes
  - id: "speckit-imp-note"
    name: "Implementation Note"
    pattern:
      regex: '^-\s+\*\*IMP-\d+\*\*: (.+)$'
    type: "fact"
    confidence: 0.90
    priority: 65

  # FR-013: Task line extraction
  - id: "speckit-task-line"
    name: "Task Line"
    pattern:
      regex: '^-\s+\[([ xX])\]\s+(T\d{3})(?:\s+\[P\])?\s*(?:\[(US[1-4])\])?\s*(.+)$'
    type: "fact"
    confidence: 0.90
    priority: 60
