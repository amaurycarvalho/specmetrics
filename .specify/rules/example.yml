id: "example-v1"
description: "Example Rule Pack for development and testing"

rules:
  - id: "exclude-eq"
    type: "exclusion"
    description: "Exclude External Inquiries from counting"
    config:
      function_types: ["EQ"]

  - id: "strict-ei-complexity"
    type: "complexity_override"
    description: "Lower threshold for High complexity on External Inputs"
    config:
      function_type: "EI"
      thresholds:
        det: [2, 8]
        ftr: [1, 2]

  - id: "custom-ei-weight"
    type: "weight_override"
    description: "Custom weight for High complexity EIs"
    config:
      function_type: "EI"
      complexity: "High"
      weight: 5

  - id: "exclude-element-fp001"
    type: "element_exclusion"
    description: "Exclude a specific functional process"
    config:
      element_ids: ["fp-001"]

  - id: "vaf-default"
    type: "vaf"
    description: "Standard VAF with neutral GSC ratings"
    config:
      gsc:
        data_communications: 2
        distributed_data_processing: 2
        performance: 2
        heavily_used_configuration: 2
        transaction_rate: 2
        online_data_entry: 2
        end_user_efficiency: 2
        online_update: 2
        complex_processing: 2
        reusability: 2
        installation_ease: 2
        operational_ease: 2
        multiple_sites: 2
        facilitate_change: 2
