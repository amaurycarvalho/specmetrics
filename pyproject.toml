[project]
name = "specmetrics"
version = "0.1.0"
description = "A Functional Measurement Engine for Specification Driven Development"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "typer>=0.12.0",
    "mcp>=1.0.0",
    "networkx>=3.0",
    "ruamel.yaml>=0.18.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
specmetrics = "specmetrics.cli.app:app"
specmetrics-mcp = "specmetrics.mcp.server:main"

[project.entry-points."specmetrics.plugins.measurement"]
apf = "specmetrics.plugins.measurement.apf.plugin:create_apf_measurement_metadata"

[project.entry-points."specmetrics.plugins.rule_pack"]
rule_pack_engine = "specmetrics.plugins.rule_pack.plugin:create_rule_pack_engine_metadata"

[project.entry-points."specmetrics.plugins.stage"]
extraction = "specmetrics.plugins.stage.extraction:create_extraction_metadata"
evidence_graph = "specmetrics.plugins.stage.evidence_graph:create_evidence_graph_metadata"
cfm_builder = "specmetrics.plugins.stage.cfm_builder:create_cfm_builder_metadata"

[project.entry-points."specmetrics.plugins.adapter"]
documents_validated = "specmetrics.plugins.adapter.openspec:create_documents_validated_metadata"
canonical_model_built = "specmetrics.plugins.adapter.openspec:create_canonical_model_built_metadata"

[project.entry-points."specmetrics.exporters"]
json = "specmetrics.plugins.exporter.json_exporter:JsonExporter"
csv = "specmetrics.plugins.exporter.csv_exporter:CsvExporter"
xml = "specmetrics.plugins.exporter.xml_exporter:XmlExporter"

[project.entry-points."specmetrics.publishers"]
otel = "specmetrics.plugins.publisher.otel_publisher:OTelPublisher"

[tool.setuptools.packages.find]
include = ["specmetrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
