[project]
name = "specmetrics"
version = "0.1.0"
description = "A Functional Measurement Engine for Specification Driven Development"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.entry-points."specmetrics.plugins.measurement"]
apf = "specmetrics.plugins.measurement.apf.plugin:APFMeasurementPlugin"

[tool.setuptools.packages.find]
include = ["specmetrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
