[project]
name = "specmetrics"
version = "0.4.0"
description = "A Functional Measurement Engine for Specification Driven Development"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "typer>=0.12.0",
    "mcp>=1.0.0",
    "networkx>=3.0",
    "ruamel.yaml>=0.18.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
specmetrics = "specmetrics.cli.app:app"
specmetrics-mcp = "specmetrics.mcp.server:main"

[project.entry-points."specmetrics.plugins.measurement"]
fpa = "specmetrics.plugins.measurement.fpa.plugin:create_fpa_measurement_metadata"
sfp = "specmetrics.plugins.measurement.sfp.plugin:create_sfp_measurement_metadata"
snap = "specmetrics.plugins.measurement.snap.plugin:create_snap_measurement_metadata"
token_points = "specmetrics.plugins.measurement.token_points.plugin:create_token_points_measurement_metadata"
cognitive_points = "specmetrics.plugins.measurement.cognitive_points.plugin:create_cognitive_points_measurement_metadata"
storypoints = "specmetrics.plugins.measurement.storypoints.plugin:create_storypoints_measurement_metadata"
tshirt = "specmetrics.plugins.measurement.tshirt.plugin:create_tshirt_measurement_metadata"
bcp = "specmetrics.plugins.measurement.bcp.plugin:create_bcp_measurement_metadata"

[project.entry-points."specmetrics.plugins.rule_pack"]
rule_pack_engine = "specmetrics.plugins.rule_pack.plugin:create_rule_pack_engine_metadata"

[project.entry-points."specmetrics.plugins.stage"]
discovery = "specmetrics.plugins.stage.discovery:create_adapter_discovery_metadata"
extraction = "specmetrics.plugins.stage.extraction:create_extraction_metadata"
evidence_graph = "specmetrics.plugins.stage.evidence_graph:create_evidence_graph_metadata"
cfm_builder = "specmetrics.plugins.stage.cfm_builder:create_cfm_builder_metadata"
csm_builder = "specmetrics.plugins.stage.csm_builder:create_csm_builder_metadata"

[project.entry-points."specmetrics.plugins.adapter"]
documents_validated = "specmetrics.plugins.adapter.openspec.bridge:create_documents_validated_metadata"
canonical_model_built = "specmetrics.plugins.adapter.openspec.bridge:create_canonical_model_built_metadata"
openspec = "specmetrics.plugins.adapter.openspec.plugin:create_openspec_adapter_metadata"
speckit = "specmetrics.plugins.adapter.speckit.plugin:create_speckit_adapter_metadata"

[project.entry-points."specmetrics.exporters"]
json = "specmetrics.plugins.exporter.json_exporter:JsonExporter"
csv = "specmetrics.plugins.exporter.csv_exporter:CsvExporter"
xml = "specmetrics.plugins.exporter.xml_exporter:XmlExporter"

[project.entry-points."specmetrics.publishers"]
otel = "specmetrics.plugins.publisher.otel_publisher:OTelPublisher"

[tool.setuptools.packages.find]
include = ["specmetrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (e.g., performance benchmarks); deselected by default",
]
