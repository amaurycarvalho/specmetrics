[project]
name = "specmetrics"
version = "0.1.0"
description = "A Functional Measurement Engine for Specification Driven Development"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
    "typer>=0.12.0",
    "mcp>=1.0.0",
    "networkx>=3.0",
    "ruamel.yaml>=0.18.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
specmetrics = "specmetrics.cli.app:app"
specmetrics-mcp = "specmetrics.mcp.server:main"

[project.entry-points."specmetrics.plugins.measurement"]
apf = "specmetrics.plugins.measurement.apf.plugin:APFMeasurementPlugin"

[project.entry-points."specmetrics.plugins.rule_pack"]
rule_pack_engine = "specmetrics.plugins.rule_pack.plugin:RulePackEnginePlugin"

[project.entry-points."specmetrics.exporters"]
json = "specmetrics.plugins.exporter.json_exporter:JsonExporter"
csv = "specmetrics.plugins.exporter.csv_exporter:CsvExporter"
xml = "specmetrics.plugins.exporter.xml_exporter:XmlExporter"

[project.entry-points."specmetrics.publishers"]
otel = "specmetrics.plugins.publisher.otel_publisher:OTelPublisher"

[tool.setuptools.packages.find]
include = ["specmetrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
